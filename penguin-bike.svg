<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="840" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Penguin riding a bicycle</title>
  <desc id="desc">A cheerful cartoon penguin wearing a red scarf rides a red bicycle across a sunny scene.</desc>

  <!-- Sky background -->
  <rect x="0" y="0" width="420" height="320" fill="#e8f4ff"/>

  <!-- Sun -->
  <circle cx="352" cy="62" r="30" fill="#ffe066"/>
  <circle cx="352" cy="62" r="40" fill="#ffe066" opacity="0.30"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="80" cy="58" rx="34" ry="18"/>
    <ellipse cx="108" cy="50" rx="26" ry="16"/>
    <ellipse cx="56" cy="50" rx="22" ry="14"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="276" width="420" height="44" fill="#bfe6a6"/>
  <rect x="0" y="276" width="420" height="4" fill="#a3d488"/>

  <!-- ================= BICYCLE ================= -->
  <g>
    <!-- Rear wheel -->
    <g>
      <circle cx="118" cy="232" r="42" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle cx="118" cy="232" r="33" fill="none" stroke="#cfd8dc" stroke-width="3"/>
      <g stroke="#9aa7ad" stroke-width="2.5">
        <line x1="118" y1="199" x2="118" y2="265"/>
        <line x1="85" y1="232" x2="151" y2="232"/>
        <line x1="95" y1="209" x2="141" y2="255"/>
        <line x1="141" y1="209" x2="95" y2="255"/>
      </g>
      <circle cx="118" cy="232" r="6" fill="#556066"/>
    </g>

    <!-- Front wheel -->
    <g>
      <circle cx="292" cy="232" r="42" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <circle cx="292" cy="232" r="33" fill="none" stroke="#cfd8dc" stroke-width="3"/>
      <g stroke="#9aa7ad" stroke-width="2.5">
        <line x1="292" y1="199" x2="292" y2="265"/>
        <line x1="259" y1="232" x2="325" y2="232"/>
        <line x1="269" y1="209" x2="315" y2="255"/>
        <line x1="315" y1="209" x2="269" y2="255"/>
      </g>
      <circle cx="292" cy="232" r="6" fill="#556066"/>
    </g>

    <!-- Frame -->
    <g fill="none" stroke="#d62828" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <line x1="118" y1="232" x2="178" y2="232"/>   <!-- chain stay -->
      <line x1="118" y1="232" x2="156" y2="168"/>   <!-- seat stay -->
      <line x1="156" y1="168" x2="178" y2="232"/>   <!-- seat tube -->
      <line x1="156" y1="168" x2="252" y2="162"/>   <!-- top tube -->
      <line x1="178" y1="232" x2="252" y2="162"/>   <!-- down tube -->
      <line x1="252" y1="162" x2="292" y2="232"/>   <!-- fork -->
    </g>

    <!-- Crank / pedals -->
    <circle cx="178" cy="232" r="9" fill="#556066"/>
    <g stroke="#556066" stroke-width="5" stroke-linecap="round">
      <line x1="178" y1="232" x2="196" y2="252"/>
      <line x1="178" y1="232" x2="160" y2="212"/>
    </g>
    <rect x="188" y="249" width="18" height="7" rx="3" fill="#2b2b2b"/>
    <rect x="150" y="204" width="18" height="7" rx="3" fill="#2b2b2b"/>

    <!-- Handlebar stem + bars -->
    <g fill="none" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round">
      <line x1="252" y1="162" x2="256" y2="142"/>
      <path d="M256 142 q2 -10 16 -10"/>
    </g>
    <circle cx="274" cy="132" r="5" fill="#2b2b2b"/>

    <!-- Seat -->
    <path d="M140 162 q16 -8 40 -2 q-4 10 -20 10 q-14 0 -20 -8 z" fill="#2b2b2b"/>
  </g>

  <!-- ================= PENGUIN ================= -->
  <g>
    <!-- Back flipper (behind body) -->
    <path d="M126 108 q-26 18 -22 52 q2 10 12 8 q10 -2 12 -18 q2 -22 8 -34 z"
          fill="#1b2430"/>

    <!-- Tail / lower body -->
    <ellipse cx="156" cy="132" rx="42" ry="56" fill="#1b2430"/>

    <!-- Belly -->
    <ellipse cx="162" cy="138" rx="27" ry="40" fill="#f4f7fa"/>

    <!-- Feet on pedals -->
    <g fill="#f5a623" stroke="#d98a12" stroke-width="2">
      <path d="M178 208 q16 2 22 10 q-2 8 -12 8 q-12 -1 -16 -10 z"/>
      <path d="M190 258 q16 2 22 10 q-2 8 -12 8 q-12 -1 -16 -10 z"/>
    </g>

    <!-- Head -->
    <circle cx="158" cy="66" r="34" fill="#1b2430"/>

    <!-- White face patch -->
    <ellipse cx="164" cy="68" rx="24" ry="22" fill="#f4f7fa"/>

    <!-- Eyes -->
    <circle cx="156" cy="60" r="5.5" fill="#1b2430"/>
    <circle cx="178" cy="60" r="5.5" fill="#1b2430"/>
    <circle cx="157.5" cy="58" r="1.8" fill="#ffffff"/>
    <circle cx="179.5" cy="58" r="1.8" fill="#ffffff"/>

    <!-- Beak -->
    <path d="M186 68 q24 4 22 10 q-2 7 -22 8 q-4 -9 0 -18 z" fill="#f5a623" stroke="#d98a12" stroke-width="2"/>

    <!-- Scarf around neck -->
    <path d="M126 90 q34 14 66 2 q2 10 -2 16 q-32 12 -66 -2 q-2 -9 2 -16 z" fill="#e14b4b"/>
    <path d="M132 104 q18 8 34 6 q-6 20 -2 34 q-12 4 -20 -2 q6 -18 -12 -38 z" fill="#c93a3a"/>

    <!-- Front flipper reaching for handlebar -->
    <path d="M182 112 q30 14 84 22 q10 2 8 10 q-2 8 -12 6 q-56 -10 -86 -22 z"
          fill="#1b2430"/>

    <!-- Little hand/wing tip on handlebar -->
    <circle cx="274" cy="140" r="7" fill="#1b2430"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#9fb7c9" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="40" y1="200" x2="74" y2="200"/>
    <line x1="28" y1="220" x2="66" y2="220"/>
    <line x1="44" y1="240" x2="78" y2="240"/>
  </g>
</svg>
